checkout_policy:
  layout: "ordinary detached Git checkouts; not submodules"
  ignore_rule: "all external content is ignored except external/pins.yaml"
  head_must_equal_revision: true
  detached_head_required: true
  clean_worktree_required: true
  origin_must_equal_url: true
  external_source_modifications_allowed: false
  lfs_payloads_materialized: false

dependencies:
  - id: "lerobot"
    role: "policy and evaluation runtime source"
    kind: "git_repository"
    url: "https://github.com/huggingface/lerobot.git"
    local_path: "external/lerobot"
    revision: "7e241bd630a3719a56157a497ce5d08f244784f1"
    resolved_from: "refs/tags/v0.6.1"
    retrieval_date: "2026-08-24"
    reason: "Immutable release containing current SmolVLA, serialized processor, LIBERO, and LIBERO-Plus integration source used for the pilot audit."
    compatibility_notes:
      - "Declares package version 0.6.1 and Python >=3.12."
      - "Its libero extra selects hf-libero >=0.1.4,<0.2.0 on Linux."
      - "Its lockfile resolves MuJoCo 3.8.1; the separate MuJoCo 3.7.0 source pin below is an audit/replay API and LIBERO-Plus reference pin, not a claim that the LeRobot lock resolves 3.7.0."
      - "Checkpoint config and policy weights accept pretrained_revision, but the eval processor load and the base VLM/tokenizer loads do not propagate a revision; fail-closed runtime enforcement remains unresolved before M0."
    checkout:
      detached: true
      clean_required: true

  - id: "canonical-libero"
    role: "canonical benchmark provenance"
    kind: "git_repository"
    url: "https://github.com/Lifelong-Robot-Learning/LIBERO.git"
    local_path: "external/libero"
    revision: "8f1084e3132a39270c3a13ebe37270a43ece2a01"
    resolved_from: "refs/heads/master"
    retrieval_date: "2026-08-24"
    reason: "Immutable snapshot of the official upstream benchmark for provenance and comparison with the LeRobot runtime fork."
    compatibility_notes:
      - "This is not the package selected by LeRobot v0.6.1's libero extra."
      - "It exposes the same Python package name, libero, as the runtime fork and LIBERO-Plus and therefore must not be co-installed in one environment."
    checkout:
      detached: true
      clean_required: true

  - id: "hf-libero"
    role: "LeRobot-compatible vanilla LIBERO runtime source"
    kind: "git_repository"
    url: "https://github.com/huggingface/LIBERO.git"
    local_path: "external/hf-libero"
    revision: "8561c60eea2fb93096146f240194649df73d8b1e"
    resolved_from: "refs/heads/main"
    retrieval_date: "2026-08-24"
    reason: "Official Hugging Face runtime fork corresponding to hf-libero 0.1.4, the dependency selected by LeRobot v0.6.1."
    compatibility_notes:
      - "Declares hf-libero version 0.1.4, robosuite 1.4.0, bddl 1.0.1, Gymnasium >=0.29, and MuJoCo >=3,<3.9."
      - "Its libero import namespace conflicts with canonical LIBERO and LIBERO-Plus."
      - "The wheel artifact is recorded but was not installed or materialized in this phase."
    distribution_artifact:
      name: "hf-libero"
      version: "0.1.4"
      format: "wheel"
      sha256: "207f76e2f28bff30f78132223d8592fe8f64b1f8fd90ce7024948ada0d7e2c27"
      materialized: false
    checkout:
      detached: true
      clean_required: true

  - id: "libero-plus"
    role: "camera-perturbation benchmark source"
    kind: "git_repository"
    url: "https://github.com/sylvestf/LIBERO-plus.git"
    local_path: "external/libero-plus"
    revision: "4976dc30028e805ff8094b55501d532c48fec182"
    resolved_from: "refs/heads/main"
    retrieval_date: "2026-08-24"
    reason: "Official LIBERO-Plus source revision used by LeRobot's reference integration and containing the camera-variant parser audited here."
    compatibility_notes:
      - "Legacy requirements and LeRobot's reference Docker environment disagree on several package versions; no runtime compatibility is claimed by this static pin."
      - "It exposes the libero import namespace and must use a runtime environment isolated from vanilla hf-libero."
      - "README and source-derived aggregate task counts disagree; this remains unresolved."
    checkout:
      detached: true
      clean_required: true

  - id: "robosuite"
    role: "simulator wrapper and legacy state API source"
    kind: "git_repository"
    url: "https://github.com/ARISE-Initiative/robosuite.git"
    local_path: "external/robosuite"
    revision: "fbee5844ff5632f5b5698e204ec5357ca50be0df"
    resolved_from: "refs/tags/v1.4.0"
    retrieval_date: "2026-08-24"
    reason: "Exact robosuite release required by hf-libero 0.1.4 and the pinned LIBERO sources."
    compatibility_notes:
      - "The flattened MjSimState contains only time, qpos, and qvel and is insufficient for exact arbitrary mid-trajectory replay."
      - "LeRobot's LIBERO-Plus Docker reference installs robosuite 1.4.1 instead, so the Plus runtime remains unverified."
    checkout:
      detached: true
      clean_required: true

  - id: "mujoco"
    role: "state-serialization API and LIBERO-Plus reference runtime source"
    kind: "git_repository"
    url: "https://github.com/google-deepmind/mujoco.git"
    local_path: "external/mujoco"
    revision: "72cb2b210da666617924de709406d6aadbe60c71"
    resolved_from: "refs/tags/3.7.0"
    retrieval_date: "2026-08-24"
    reason: "Immutable API source for mjSTATE_INTEGRATION and the version explicitly installed by LeRobot's LIBERO-Plus reference Dockerfile."
    compatibility_notes:
      - "hf-libero permits this version, but LeRobot v0.6.1's lockfile currently resolves 3.8.1."
      - "This bootstrap does not install MuJoCo and does not verify EGL rendering."
    checkout:
      detached: true
      clean_required: true

